<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>Blip ver4 - 블립판</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      font-family: -apple-system, "Noto Sans KR", sans-serif;
      background: #fff;
      color: #111;
      overflow: hidden;
      -webkit-font-smoothing: antialiased
    }

    button {
      font: inherit;
      color: inherit
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh
    }

    .chrome {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      flex: none
    }

    .cells {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 0
    }

    .cell {
      position: relative;
      background: #f3f2ee;
      border-radius: 12px;
      padding: 0 14px;
      cursor: pointer;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 54px;
      flex: 1;
      transition: background .15s;
      user-select: none
    }

    .cell:hover,
    .cell.open {
      background: #e8e6df
    }

    .cell .ct {
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .cell .cs {
      font-size: 11px;
      color: #8a877f;
      white-space: nowrap;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .cell.sl {
      flex: 1.6;
      cursor: default
    }

    .cell.sl:hover {
      background: #f3f2ee
    }

    .cell.sl.open {
      background: #e8e6df
    }

    .sl-top {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sl-top .ct {
      flex: 1
    }

    .slv {
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums
    }

    .predBtn {
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 9px;
      cursor: pointer;
      white-space: nowrap
    }

    .predBtn:disabled {
      background: #cfccc4;
      cursor: default
    }

    #slider {
      width: 100%;
      margin: 5px 0 0;
      accent-color: #111;
      height: 14px
    }

    #slider:disabled {
      opacity: .35
    }

    .cell.active {
      background: #111;
      color: #fff
    }

    .cell.active:hover {
      background: #2a2a2a
    }

    .cell.active .cs {
      color: #9a9a9a
    }

    .panel {
      position: absolute;
      top: 60px;
      left: 0;
      width: 360px;
      max-height: 64vh;
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 12px 32px rgba(0, 0, 0, .14);
      z-index: 300;
      display: none;
      padding: 14px;
      cursor: default
    }

    .cell.open>.panel {
      display: block
    }

    .ph {
      font-size: 13px;
      font-weight: 800
    }

    .ps {
      font-size: 11px;
      color: #8a877f;
      margin: 3px 0 12px
    }

    .slot {
      background: #f7f6f3;
      border: 1px dashed #dcd9d1;
      border-radius: 10px
    }

    .sl-grid {
      display: grid;
      gap: 8px
    }

    .sl-grid.g3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .sl-grid.g3 .slot {
      aspect-ratio: 1
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 20px 20px;
      min-height: 0;
      position: relative
    }

    .doctab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 0;
      flex: none;
      min-width: 0
    }

    .dt-l {
      font-size: 10.5px;
      font-weight: 800;
      color: #8a877f;
      flex: none
    }

    .dt-t {
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      width: 220px;
      border: 0;
      background: transparent;
      outline: none;
      padding: 0
    }

    .dt-r {
      margin-left: auto;
      font-size: 11px;
      color: #8a877f;
      font-variant-numeric: tabular-nums;
      flex: none
    }

    .flow {
      flex: 1;
      min-height: 0;
      position: relative;
      padding-bottom: 118px
    }

    .cfWrap {
      position: absolute;
      inset: 0
    }

    .cf {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 18px 40px rgba(0, 0, 0, .12);
      cursor: pointer;
      transition: transform .45s cubic-bezier(.2, .8, .2, 1), opacity .35s
    }

    .cf.cur {
      cursor: default
    }

    .cf.far {
      opacity: 0;
      pointer-events: none
    }

    .cf.locked::after {
      content: "바꾸지마 · 고정됨";
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10.5px;
      font-weight: 800;
      background: #111;
      color: #fff;
      border-radius: 999px;
      padding: 4px 9px
    }

    .dock {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(760px, 100%);
      height: 108px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 10px 30px rgba(0, 0, 0, .1);
      overflow: hidden
    }

    .dockRow {
      position: absolute;
      top: 14px;
      left: 50%;
      height: 80px;
      display: flex;
      gap: 10px;
      transition: transform .45s cubic-bezier(.2, .9, .25, 1)
    }

    .dk {
      position: relative;
      flex: none;
      width: 128px;
      height: 80px;
      border-radius: 12px;
      background: #f3f2ee;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .06);
      transition: box-shadow .2s
    }

    .dk.cur {
      box-shadow: 0 0 0 2.5px #111
    }

    .dk .dkname {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 8px 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(transparent, rgba(0, 0, 0, .55));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .dk .dklock {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .92);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #555;
      opacity: 0;
      transition: opacity .15s
    }

    .dk:hover .dklock,
    .dk.locked .dklock {
      opacity: 1
    }

    .dk.locked .dklock {
      color: #111
    }

    .dk .dklock svg {
      width: 11px;
      height: 11px
    }

    .dk .dkchg {
      position: absolute;
      left: 5px;
      top: 5px;
      font-size: 9px;
      font-weight: 800;
      background: #2f7cf6;
      color: #fff;
      border-radius: 999px;
      padding: 1px 5px
    }

    .dk.plus {
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: inset 0 0 0 1.5px #d6d3cb
    }

    .dk.plus span {
      font-size: 30px;
      font-weight: 300;
      color: #9a9a9a
    }

    .sbar {
      height: 128px;
      flex: none;
      margin: 0 20px 10px;
      background: #fff;
      border: 1px solid #ebe9e3;
      border-radius: 18px;
      display: flex;
      align-items: stretch;
      padding: 12px 14px;
      gap: 16px;
      overflow-x: auto;
      overflow-y: hidden
    }

    .sb-head {
      flex: none;
      width: 118px;
      padding-top: 2px
    }

    .sb-t {
      font-size: 13px;
      font-weight: 800
    }

    .sb-s {
      font-size: 11px;
      color: #8a877f;
      margin-top: 4px;
      line-height: 1.4
    }

    .sb-sec {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: none
    }

    .sb-lb {
      font-size: 10.5px;
      font-weight: 800;
      color: #8a877f
    }

    .sb-row {
      display: flex;
      gap: 8px;
      flex: 1
    }

    .sb-row .slot {
      width: 104px
    }

    .sb-row .slot.a {
      width: 86px
    }

    .sb-div {
      width: 1px;
      background: #efede8;
      flex: none
    }

    .more {
      border: 1px dashed #d6d3cb;
      background: transparent;
      border-radius: 12px;
      width: 86px;
      color: #8a877f;
      font-size: 10.5px;
      line-height: 1.35;
      cursor: pointer
    }

    .more:hover {
      background: #f7f6f3
    }

    .sk {
      background: linear-gradient(90deg, #f0eee9 25%, #e6e3dc 50%, #f0eee9 75%);
      background-size: 200% 100%;
      animation: sh 1.1s linear infinite;
      border-radius: 10px;
      border: 0
    }

    @keyframes sh {
      to {
        background-position: -200% 0
      }
    }

  </style>
</head>

<body>
  <div class="app">
    <div class="chrome">
      <div class="cells">
        <div class="cell" id="cBlip">
          <div class="ct">.blip 불러오기</div>
          <div class="cs">내가 담은 것 · 관련도순</div>
        </div>
        <div class="cell" id="cTpl">
          <div class="ct">동적객체 브라우징</div>
        </div>
        <div class="cell" id="cAsset">
          <div class="ct">정적객체 브라우징</div>
        </div>
        <div class="cell sl" id="cSl">
          <div class="sl-top"><span class="ct">정도</span><span class="slv" id="slVal">—</span><button class="predBtn"
              id="predBtn">예측 결과값</button></div>
          <input type="range" id="slider" min="0" max="100" value="50">
          <div class="panel" id="pPred" style="width:380px">
            <div class="ph">예측 결과값</div>
            <div class="ps">정도를 바꾸면 나올 결과</div>
            <div class="sl-grid g3" id="predGrid">
              <div class="slot"></div>
              <div class="slot"></div>
              <div class="slot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="sbar" id="sbar"></div>
    <div class="main">
      <div class="doctab"><span class="dt-l">목적</span><input class="dt-t" id="dtT" placeholder="목적 입력"
          autocomplete="off"><span class="dt-r" id="dtR"></span></div>
      <div class="flow" id="flow">
        <div class="cfWrap" id="cfWrap"></div>
        <div class="dock" id="dock">
          <div class="dockRow" id="dockRow"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const $ = s => document.querySelector(s);
      /* 레이어: 하나씩 + 로 쌓임. 각 레이어는 앞 레이어 결과를 이어받음.
         앞 레이어가 바뀌면 뒷 레이어도 바뀜. locked(바꾸지마)인 레이어는 고정. */
      let uid = 0, layers = [], sel = 0, purpose = '', activeTab = null;
      const TABS = {
        blip: { title: '.blip 불러오기', sub: '관련도순', count: 4, w: 104 },
        tpl: { title: '동적객체 브라우징', sub: '템플릿 추천', count: 4, w: 104 },
        asset: { title: '정적객체 브라우징', sub: '애셋 추천', count: 8, w: 86 }
      };
      const TAB_OF = { cBlip: 'blip', cTpl: 'tpl', cAsset: 'asset' };
      const nl = () => ({ id: 'L' + (++uid), v: null, locked: false });
      const lockSvg = on => on ? '<svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7.5" rx="1.6" fill="currentColor"/><path d="M5.2 7V5.2a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' : '<svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.2 7V5.2a2.8 2.8 0 0 1 5.5-.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
      const cur = () => layers[sel];

      function markChanged(from) { // 앞 레이어(from) 수정 → 뒤 레이어 중 잠기지 않은 것 표시
        layers.forEach((L, i) => { if (i > from && !L.locked) { L._chg = Date.now() } });
        renderDock(); setTimeout(() => { layers.forEach(L => { if (L._chg && Date.now() - L._chg >= 1400) delete L._chg }); renderDock() }, 1450);
      }
      function renderAll() { renderDoc(); renderFlow(); renderDock(); renderSlider() }
      function renderDoc() { $('#dtT').value = purpose; $('#dtR').textContent = layers.length ? '레이어 ' + (sel + 1) + ' / ' + layers.length : '' }
      const SIDE = 2;
      function sizes() { const el = $('#flow'); const h = el.clientHeight - 118, cw = Math.min(el.clientWidth * .56, h * .9 * 1.4, 900), ch = cw / 1.4; return { cw, ch } }
      function slotTf(o, cw) {
        if (o === 0) return { tf: 'translate(-50%,-50%)', z: 50 };
        const a = Math.abs(o), sgn = Math.sign(o), flowW = $('#flow').clientWidth, x = sgn * (flowW * .11 + (a > 1 ? flowW * .09 : 0));
        return { tf: 'translate(calc(-50% + ' + x + 'px),-50%)', z: 50 - a };
      }
      function renderFlow() {
        const { cw, ch } = sizes(); let h = '';
        layers.forEach((L, i) => {
          const o = i - sel, oc = Math.max(-SIDE - 1, Math.min(SIDE + 1, o)), t = slotTf(oc, cw);
          h += '<div class="cf' + (i === sel ? ' cur' : '') + (Math.abs(o) > SIDE ? ' far' : '') + (L.locked ? ' locked' : '') + '" data-i="' + i + '" style="width:' + cw + 'px;height:' + ch + 'px;transform:' + t.tf + ';z-index:' + t.z + '"></div>';
        });
        $('#cfWrap').innerHTML = h;
      }
      function renderDock() {
        let h = ''; layers.forEach((L, i) => {
          h += '<div class="dk' + (i === sel ? ' cur' : '') + (L.locked ? ' locked' : '') + '" data-i="' + i + '">' + (L._chg ? '<span class="dkchg">바뀜</span>' : '') + '<button class="dklock" data-lock="' + i + '" title="' + (L.locked ? '잠금 풀기' : '바꾸지마') + '">' + lockSvg(L.locked) + '</button><span class="dkname">레이어 ' + (i + 1) + '</span></div>';
        });
        h += '<div class="dk plus" id="dkPlus" title="레이어 추가"><span>+</span></div>';
        $('#dockRow').innerHTML = h;
        const cardW = 138; $('#dockRow').style.transform = 'translateX(' + (-(sel * cardW + cardW / 2)) + 'px)';
      }
      function renderSlider() { const L = cur(), s = $('#slider'); s.disabled = !L || L.locked; $('#predBtn').disabled = !L || L.locked; $('#slVal').textContent = L && L.v != null ? L.v + '%' : '—'; if (L && document.activeElement !== s) s.value = L.v ?? 50 }
      let bt;
      function renderBar(loading) {
        const c = loading ? 'sk' : 'slot';
        if (activeTab) {
          const t = TABS[activeTab];
          $('#sbar').innerHTML = '<div class="sb-head"><div class="sb-t">' + t.title + '</div><div class="sb-s">' + t.sub + '</div></div><div class="sb-sec"><div class="sb-row">' + ('<div class="' + c + '" style="width:' + t.w + 'px"></div>').repeat(t.count) + '</div></div>';
          return;
        }
        const L = cur(); if (!L) { $('#sbar').innerHTML = ''; return }
        const head = '<div class="sb-head"><div class="sb-t">제안</div><div class="sb-s">레이어 ' + (sel + 1) + '</div></div>';
        $('#sbar').innerHTML = head + '<div class="sb-sec"><div class="sb-lb">이 단계</div><div class="sb-row">' + ('<div class="' + c + '" style="width:104px"></div>').repeat(3) + '</div></div><div class="sb-div"></div><div class="sb-sec"><div class="sb-lb">맥락에 맞는 애셋</div><div class="sb-row">' + ('<div class="' + c + ' a" style="width:86px"></div>').repeat(4) + '<button class="more" id="more">검색해서<br>가져오기</button></div></div>';
      }
      function loadBar() { renderBar(true); clearTimeout(bt); bt = setTimeout(() => renderBar(), 700) }
      function clearTab() { if (!activeTab) return; activeTab = null; document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active')) }
      function setTab(key) {
        if (activeTab === key) { clearTab() }
        else { document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active')); activeTab = key; document.getElementById(Object.keys(TAB_OF).find(id => TAB_OF[id] === key)).classList.add('active') }
        loadBar();
      }
      function addLayer() { clearTab(); layers.push(nl()); sel = layers.length - 1; renderAll(); loadBar() }
      function select(i) { clearTab(); sel = i; renderAll(); renderBar() }
      function setLock(i, on) { layers[i].locked = on; renderAll() }

      function closePanels() { document.querySelectorAll('.cell.open').forEach(c => c.classList.remove('open')) }
      Object.keys(TAB_OF).forEach(id => $('#' + id).addEventListener('click', () => setTab(TAB_OF[id])));
      $('#predBtn').addEventListener('click', e => { e.stopPropagation(); const c = $('#cSl'), was = c.classList.contains('open'); closePanels(); if (!was) { c.classList.add('open'); const g = $('#predGrid'); g.innerHTML = '<div class="sk" style="aspect-ratio:1"></div>'.repeat(3); setTimeout(() => { g.innerHTML = '<div class="slot"></div>'.repeat(3) }, 500) } });
      $('#slider').addEventListener('input', e => { const L = cur(); if (!L || L.locked) return; L.v = +e.target.value; $('#slVal').textContent = L.v + '%' });
      $('#slider').addEventListener('change', () => { if (cur() && !cur().locked) markChanged(sel) });
      $('#sbar').addEventListener('click', e => { if (e.target.closest('#more')) setTab('asset') });
      $('#cfWrap').addEventListener('click', e => { const c = e.target.closest('.cf[data-i]'); if (c) select(+c.dataset.i) });
      $('#dockRow').addEventListener('click', e => {
        if (e.target.closest('#dkPlus')) { addLayer(); return }
        const lk = e.target.closest('[data-lock]'); if (lk) { e.stopPropagation(); const i = +lk.dataset.lock; setLock(i, !layers[i].locked); return }
        const d = e.target.closest('.dk[data-i]'); if (d) select(+d.dataset.i);
      });
      document.addEventListener('click', e => { const p = e.composedPath(); if (!p.some(n => n.classList && n.classList.contains('cell')) && !p.some(n => n.id === 'sbar')) closePanels() });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closePanels(); return }
        if (!layers.length) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); select(Math.min(layers.length - 1, sel + 1)) }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); select(Math.max(0, sel - 1)) }
      });
      let acc = 0, lastT = 0;
      $('#flow').addEventListener('wheel', e => {
        if (!layers.length) return; e.preventDefault();
        const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        const t = performance.now(); if (t - lastT > 220) acc = 0; lastT = t;
        acc += d; const step = 46;
        while (Math.abs(acc) >= step) { const s = Math.sign(acc); acc -= s * step; select(Math.max(0, Math.min(layers.length - 1, sel + s))) }
      }, { passive: false });

      const dtT = $('#dtT');
      dtT.addEventListener('input', () => { purpose = dtT.value });

      layers = [nl()]; sel = 0;
      addEventListener('resize', renderFlow); renderAll(); loadBar();
      setTimeout(() => dtT.focus(), 50);
    })();
  </script>
  <div class="ver-switch" id="verSw"><button type="button" class="vs-btn">versions</button>
    <div class="vs-menu"><a href="wordsearch.html">ver1</a><a href="ver2.html">ver2</a><a href="ver3.html">ver3 -
        취준</a><a href="ver3-designer.html">ver3 - 디자이너</a><a href="ver3-jwj-slider.html">ver3 - 주우재 슬라이더</a><a
        href="ver3-jwj-icon.html">ver3 - 주우재 아이콘</a><a href="ver4.html" class="cur">ver4 - 블립판</a></div>
  </div>
  <style>
    .ver-switch {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 5000;
      font: 800 11px "Montserrat", -apple-system, sans-serif;
      letter-spacing: .04em
    }

    .ver-switch .vs-btn {
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: #f1f1f1;
      color: #8a8a8a;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      transition: background .15s, color .15s
    }

    .ver-switch .vs-btn:hover,
    .ver-switch.open .vs-btn {
      background: #111;
      color: #fff
    }

    .ver-switch .vs-menu {
      position: absolute;
      right: 0;
      bottom: 36px;
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 5px;
      border-radius: 12px;
      background: #fff;
