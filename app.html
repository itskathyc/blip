<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <title>Blip - 데스크탑 앱</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      font-family: -apple-system, "Noto Sans KR", sans-serif;
      background: #fff;
      color: #111;
      overflow: hidden;
      -webkit-font-smoothing: antialiased
    }

    button {
      font: inherit;
      color: inherit
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh
    }

    .pubAll {
      flex: none;
      height: 30px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap
    }

    .pubAll:hover {
      background: #2a2a2a
    }

    /* ---------- 소통 컴포넌트: 검색창 + 제안 / 검색 결과 ---------- */
    .sqWrap {
      flex: none;
      align-self: center;
      position: relative;
      width: 200px
    }

    .sqWrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: #8a877f;
      pointer-events: none
    }

    .sq {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: #f3f2ee;
      padding: 0 14px 0 34px;
      font: inherit;
      font-size: 12.5px;
      outline: none
    }

    .sq:focus {
      box-shadow: inset 0 0 0 1.5px #111
    }

    .sbBody {
      display: flex;
      gap: 16px;
      flex: none
    }

    .sb-item {
      flex: none;
      width: 96px;
      border: 1px solid #ebe9e3;
      border-radius: 10px;
      background: #faf9f6;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow: hidden
    }

    .sb-item i {
      display: block;
      flex: 1;
      min-height: 18px;
      border-radius: 7px
    }

    .sb-item b {
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sb-item em {
      font-size: 9.5px;
      color: #8a877f;
      font-style: normal;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .app.searching .main {
      display: none
    }

    .app.searching .sbar {
      flex: 1;
      height: auto;
      flex-direction: column;
      align-items: stretch;
      overflow-x: hidden;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 18px 20px
    }

    .app.searching .sqWrap {
      width: 100%;
      align-self: stretch
    }

    .app.searching .sbBody {
      flex-direction: column;
      gap: 22px;
      flex: none
    }

    .sr-sec .sb-lb {
      margin-bottom: 10px
    }

    .sr-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px
    }

    .sr-grid .sb-item {
      height: 96px
    }

    .sr-web {
      width: 250px;
      border: 1px solid #ebe9e3;
      border-radius: 12px;
      background: #fff;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .sr-web b {
      font-size: 13px;
      font-weight: 800
    }

    .sr-web span {
      font-size: 11px;
      color: #2f7cf6;
      font-weight: 700
    }

    .sr-web p {
      margin: 2px 0 4px;
      font-size: 11.5px;
      color: #55524a;
      line-height: 1.45
    }

    .sr-web a {
      font-size: 10.5px;
      color: #8a877f;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sr-web a:hover {
      color: #111;
      text-decoration: underline
    }

    .sr-empty {
      font-size: 12.5px;
      color: #8a877f
    }

    .viewport {
      flex: 1;
      min-height: 0;
      position: relative
    }

    /* ---------- 콘텐츠 편집 화면 + 하단 레이어 슬라이더 ---------- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 20px 20px;
      min-height: 0;
      position: relative
    }

    .doctab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 0;
      flex: none;
      min-width: 0
    }

    .dt-l {
      font-size: 10.5px;
      font-weight: 800;
      color: #8a877f;
      flex: none
    }

    .dt-t {
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      width: 220px;
      border: 0;
      background: transparent;
      outline: none;
      padding: 0
    }

    .dt-r {
      margin-left: auto;
      font-size: 11px;
      color: #8a877f;
      font-variant-numeric: tabular-nums;
      flex: none
    }

    .flow {
      flex: 1;
      min-height: 0;
      position: relative;
      padding-bottom: 118px
    }

    .cfWrap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 118px
    }

    .cf {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 18px 40px rgba(0, 0, 0, .12);
      cursor: default;
      overflow: hidden;
      transition: opacity .35s
    }

    .cf.draft .scr {
      opacity: .5
    }

    .publishBtn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2)
    }

    .publishBtn:hover {
      background: #2a2a2a
    }

    .cf.locked::after {
      content: "바꾸지마 · 고정됨";
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 10.5px;
      font-weight: 800;
      background: #111;
      color: #fff;
      border-radius: 999px;
      padding: 4px 9px
    }

    /* ---------- 빈칸 선언: 어디서든 드래그 → 점선 영역 + 아이콘 줄 + 입력 (blank-declare.html 개념) ---------- */
    /* 안의 아이콘·입력·X는 --k(기준 500×290 대비 비율)로 함께 줄어듦 */
    .rg{--k:1;position:fixed;z-index:40;border:max(1.5px,calc(3px*var(--k))) dashed #3f4a3a;border-radius:calc(34px*var(--k));background:rgba(255,255,255,.55);pointer-events:none}
    .rg.done{background:#fff;pointer-events:auto;box-shadow:0 12px 40px rgba(0,0,0,.08)}
    .rg .rx{position:absolute;right:calc(-22px*var(--k));top:calc(-24px*var(--k));width:calc(52px*var(--k));height:calc(52px*var(--k));border-radius:50%;border:max(1.5px,calc(3px*var(--k))) solid #222;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
    .rg .rx svg{width:50%;height:50%}
    .rg .ri{position:absolute;left:0;right:0;top:calc(44px*var(--k));display:flex;justify-content:space-evenly;padding:0 calc(30px*var(--k))}
    .rg .ri button{position:relative;width:calc(62px*var(--k));height:calc(62px*var(--k));border:0;padding:0;background:none;cursor:pointer;border-radius:calc(14px*var(--k));transition:transform .12s}
    .rg .ri button:hover{transform:translateY(-2px)}
    .rg .ri button.on{transform:scale(.92)}
    .rg .ri img{width:100%;height:100%;object-fit:contain;display:block;border-radius:calc(14px*var(--k))}
    .rg input{position:absolute;left:28%;right:calc(24px*var(--k));top:calc(136px*var(--k));height:calc(52px*var(--k));padding:0;border:0;outline:0;background:none;font:700 calc(30px*var(--k)) -apple-system,"Noto Sans KR",sans-serif;color:#111;caret-color:#111}
    .rg .rnew{position:absolute;left:calc(40px*var(--k));right:calc(40px*var(--k));top:calc(46px*var(--k));font:800 calc(26px*var(--k)) -apple-system,"Noto Sans KR",sans-serif;color:#111;letter-spacing:-.01em}
    .rg.newmode input{left:calc(40px*var(--k));top:calc(104px*var(--k))}
    body.drawing,body.drawing *{cursor:crosshair!important}

    /* 빈칸에서 만든 아이템: 보이지 않는 격자에 붙어 지울 때까지 그 자리에. 꾹 누르면 흔들리며 X로 제거 */
    #bfull{position:fixed;inset:0;z-index:35;pointer-events:none}
    .bitem{position:absolute;width:120px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font:700 13.5px -apple-system,"Noto Sans KR",sans-serif;color:#111;white-space:nowrap;pointer-events:auto;user-select:none;-webkit-user-select:none}
    .bitem .bic{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.08);background:#fff;font-size:28px;font-weight:800;color:#8a877f}
    .bitem span{max-width:120px;overflow:hidden;text-overflow:ellipsis}
    .bitem .bx{position:absolute;left:14px;top:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#111;color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer;display:none}
    body.wiggle .bitem{animation:bWig .26s ease-in-out infinite alternate}
    body.wiggle .bitem:nth-child(2n){animation-delay:-.13s}
    body.wiggle .bitem .bx{display:block}
    @keyframes bWig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

    /* 처음 쓰는 사람에게: 반투명 커서가 직접 빈칸을 그려 여는 시범 */
    .gh{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .4s}
    .gh.on{opacity:1}
    .gh .rg{z-index:auto;opacity:.6;transition:background .25s,box-shadow .25s}
    .gh .rg.done{pointer-events:none}
    .gh .ri button{cursor:default;opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
    .gh .ri button.pop{opacity:1;transform:none}
    .gh .caret{position:absolute;left:28%;top:calc(140px*var(--k));width:max(1.5px,calc(3px*var(--k)));height:calc(42px*var(--k));background:#111;opacity:0}
    .gh .rg.done .caret{animation:ghBlink 1s steps(1) infinite}
    @keyframes ghBlink{0%{opacity:1}50%{opacity:0}}
    .gh .cur{position:absolute;width:22px;height:22px;margin:-2px 0 0 -3px;transition:transform .15s}
    .gh .cur.down{transform:scale(.85)}
    .gh .cur svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
    .gh .cur .x{display:none}
    .gh .cur.drag .a{display:none}
    .gh .cur.drag .x{display:block}
    .gh .cap{position:absolute;transform:translateX(-50%);font:700 14px -apple-system,"Noto Sans KR",sans-serif;color:#3f4a3a;white-space:nowrap;letter-spacing:-.01em;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:999px}
    @media (prefers-reduced-motion:reduce){.gh,.gh .cur,.gh .ri button{transition:none}.gh .rg.done .caret{animation:none;opacity:1}body.wiggle .bitem{animation:none}}

    /* ---------- 레이어 안 화면 콘텐츠 (빵메뉴추천 · 위치기반 BEST 빵 찾기) ---------- */
    .scr {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: 30px 32px;
      cursor: default
    }

    .scr-h1 {
      font-size: 19px;
      font-weight: 800;
      margin: 0 0 4px
    }

    .scr-sub {
      font-size: 12.5px;
      color: #8a877f;
      margin: 0 0 20px
    }

    .scr-field {
      margin-bottom: 18px
    }

    .scr-field .fl,
    .fl {
      font-size: 11px;
      font-weight: 800;
      color: #8a877f;
      margin-bottom: 8px
    }

    .chiprow {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .chip {
      border: 1.5px solid #e3e1da;
      background: #fff;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #555;
      cursor: default
    }

    .chip.on {
      background: #111;
      border-color: #111;
      color: #fff
    }

    .breadgrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 4px
    }

    .breaditem {
      position: relative;
      border: 1.5px solid #e3e1da;
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      background: #f9f8f5;
      transition: all .15s
    }

    .breaditem .bi {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      margin: 0 auto 8px
    }

    .breaditem b {
      font-size: 12px;
      font-weight: 800;
      display: block
    }

    .breaditem.sel {
      border-color: #111;
      background: #fff
    }

    .breaditem.sel::after {
      content: "✓";
      position: absolute;
      top: 6px;
      right: 8px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      display: grid;
      place-items: center
    }

    .scoreWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 24px
    }

    .scoreNum {
      font-size: 44px;
      font-weight: 800;
      line-height: 1
    }

    .scoreNum span {
      font-size: 16px;
      font-weight: 700;
      color: #8a877f;
      margin-left: 4px
    }

    .scorebar {
      width: 100%;
      max-width: 280px;
      height: 8px;
      border-radius: 999px;
      background: #eceae4;
      margin-top: 14px;
      overflow: hidden
    }

    .scorebar i {
      display: block;
      height: 100%;
      background: #111;
      border-radius: 999px
    }

    .top3 {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .top3 li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 15px;
      border-radius: 12px;
      background: #f9f8f5
    }

    .top3 .rk {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex: none
    }

    .top3 .nm {
      font-size: 13px;
      font-weight: 800;
      flex: 1
    }

    .top3 .pc {
      font-size: 12.5px;
      font-weight: 800;
      color: #2f7cf6
    }

    .top3 li.win {
      background: #111;
      color: #fff
    }

    .top3 li.win .rk {
      background: #fff;
      color: #111
    }

    .top3 li.win .pc {
      color: #9ad1ff
    }

    .dock {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(760px, 100%);
      height: 108px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 10px 30px rgba(0, 0, 0, .1);
      overflow: hidden
    }

    .dockRow {
      position: absolute;
      top: 14px;
      left: 50%;
      height: 80px;
      display: flex;
      gap: 10px;
      transition: transform .45s cubic-bezier(.2, .9, .25, 1)
    }

    .dk {
      position: relative;
      flex: none;
      width: 128px;
      height: 80px;
      border-radius: 12px;
      background: #f3f2ee;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .06);
      transition: box-shadow .2s
    }

    .dk.cur {
      box-shadow: 0 0 0 2.5px #111
    }

    .dk .dkname {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 8px 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(transparent, rgba(0, 0, 0, .55));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .dk .dklock {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .92);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #555;
      opacity: 0;
      transition: opacity .15s
    }

    .dk:hover .dklock,
    .dk.locked .dklock {
      opacity: 1
    }

    .dk.locked .dklock {
      color: #111
    }

    .dk .dklock svg {
      width: 11px;
      height: 11px
    }

    .dk-mini {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 12px;
      pointer-events: none
    }

    .dk.draft .dk-mini {
      opacity: .5
    }

    .mini-box {
      position: relative;
      width: 400px;
      height: 250px;
      transform: scale(.32);
      transform-origin: top left
    }

    .dk.plus {
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: inset 0 0 0 1.5px #d6d3cb
    }

    .dk.plus span {
      font-size: 30px;
      font-weight: 300;
      color: #9a9a9a
    }


    .sbar {
      height: 128px;
      flex: none;
      margin: 14px 20px 10px;
      background: #fff;
      border: 1px solid #ebe9e3;
      border-radius: 18px;
      display: flex;
      align-items: stretch;
      padding: 12px 14px;
      gap: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none
    }

    .sbar::-webkit-scrollbar {
      display: none
    }

    .sb-sec {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: none
    }

    .sb-lb {
      font-size: 10.5px;
      font-weight: 800;
      color: #8a877f
    }

    .sb-row {
      display: flex;
      gap: 8px;
      flex: 1
    }

    .sb-row .slot {
      width: 104px
    }

    .sb-row .slot.a {
      width: 86px
    }

    .sb-app {
      flex: none;
      align-self: center;
      width: 64px;
      height: 64px;
      border: 0;
      background: transparent;
      padding: 0;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s
    }

    .sb-app:hover {
      transform: translateY(-2px)
    }

    .sb-app svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .sb-div {
      width: 1px;
      background: #efede8;
      flex: none
    }

    .slot {
      background: #f7f6f3;
      border: 1px dashed #dcd9d1;
      border-radius: 10px
    }

    .sk {
      background: linear-gradient(90deg, #f0eee9 25%, #e6e3dc 50%, #f0eee9 75%);
      background-size: 200% 100%;
      animation: sh 1.1s linear infinite;
      border-radius: 10px;
      border: 0
    }

    @keyframes sh {
      to {
        background-position: -200% 0
      }
    }

  </style>
</head>

<body>
  <div class="shell">
    <div class="viewport">
      <div class="app" id="app">
        <div class="sbar" id="sbar">
          <div class="sqWrap"><svg viewBox="0 0 16 16">
              <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg><input class="sq" id="sq" placeholder="블립에게 검색하거나 말하기" autocomplete="off"></div>
          <div class="sbBody" id="sbBody"></div>
        </div>
        <div class="main">
          <div class="doctab"><span class="dt-l">목적</span><input class="dt-t" id="dtT" placeholder="목적 입력"
              autocomplete="off"><span class="dt-r" id="dtR"></span><button class="pubAll"
              id="pubAll">발행하기</button></div>
          <div class="flow" id="flow">
            <div class="cfWrap" id="cfWrap"></div>
            <div class="dock" id="dock">
              <div class="dockRow" id="dockRow"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="bfull"></div>
  <script>
    (() => {
      const $ = s => document.querySelector(s);

        const dx = e.clientX - dockDrag.x0;
        $('#dockRow').style.transition = '';
        if (Math.abs(dx) > 4) suppressDockClick = true;
        const arr = items(), steps = Math.round(-dx / dockCardW);
        const newSel = Math.max(0, Math.min(arr.length - 1, sel + steps));
        dockDrag = null;
        if (newSel !== sel) select(newSel); else renderDock();
      });
      /* ---------- 빈칸 선언: 어디서든 드래그 → 점선 영역 + 아이콘 줄 + 입력 ---------- */
      const RX = '<button class="rx" title="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="4.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      const ACTIONS = [
        { k: 'new', t: '새로운 아이템선언', src: 'blank-declare/icons/ic-new.png' },
        { k: 'claude', t: 'Claude', src: 'blank-declare/icons/ic-claude.png' },
        { k: 'kakao', t: '카카오톡', src: 'blank-declare/icons/ic-kakao.png' },
        { k: 'excel', t: 'Excel', src: 'blank-declare/icons/ic-excel.png' }
      ];
      const regionIcons = () => ACTIONS.map(a => '<button data-a="' + a.k + '" title="' + esc(a.t) + '"><img src="' + a.src + '" alt="' + esc(a.t) + '"></button>').join('');
      const NODRAW = '.rg, .bitem, button, a, input, textarea, .sbar, .dock, .chip, .breaditem';
      const GRID = 24, snap = v => Math.round(v / GRID) * GRID;
      let dr = null, rgEl = null, bItems = [], bUid = 0, pressT = 0;
      function closeRegion() { if (rgEl) { rgEl.remove(); rgEl = null } }
      function renderItems() {
        $('#bfull').innerHTML = bItems.map(it => '<div class="bitem" data-id="' + it.id + '" style="left:' + it.x + 'px;top:' + it.y + 'px"><button class="bx" data-rm="' + it.id + '" title="제거">×</button><div class="bic">' + esc(it.name[0]) + '</div><span>' + esc(it.name) + '</span></div>').join('');
      }
      function newObjectMode(el) {
        el.classList.add('newmode'); el.querySelector('.ri').remove();
        const t = document.createElement('div'); t.className = 'rnew'; t.textContent = '새로운 아이템선언'; el.appendChild(t);
        const inp = el.querySelector('input'); inp.value = ''; inp.focus();
        inp.addEventListener('keydown', e => {
          if (e.key !== 'Enter' || e.isComposing) return; e.preventDefault();
          const v = inp.value.trim(); if (!v) return;
          const r = el.getBoundingClientRect();
          bItems.push({ id: 'b' + (++bUid), name: v, x: snap(r.left + r.width / 2 - 60), y: snap(r.top + r.height / 2 - 60) });
          closeRegion(); renderItems();
        });
      }
      function openRegion(el) {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--k', Math.min(r.width / 500, r.height / 290)); el.classList.add('done');
        el.innerHTML = RX + '<div class="ri">' + regionIcons() + '</div><input type="text" spellcheck="false" aria-label="입력">';
        rgEl = el;
        const inp = el.querySelector('input');
        el.querySelector('.rx').addEventListener('click', closeRegion);
        el.querySelector('.ri').addEventListener('click', e => {
          const b = e.target.closest('button[data-a]'); if (!b) return; e.stopPropagation();
          if (b.dataset.a === 'new') { newObjectMode(el); return }
          el.querySelectorAll('.ri button').forEach(x => x.classList.toggle('on', x === b && !b.classList.contains('on')));
        });
        inp.addEventListener('keydown', e => {
          if (e.key !== 'Enter' || e.isComposing || el.classList.contains('newmode')) return; e.preventDefault();
          const q = inp.value.trim(); if (!q) return;
          closeRegion(); $('#sq').value = q; setQuery(q);
        });
        setTimeout(() => inp.focus(), 0);
      }

      /* 꾹 누르면 흔들림 → X로 제거. 흔들리는 중에 빈 곳을 누르면 멈춤 */
      $('#bfull').addEventListener('pointerdown', e => {
        const it = e.target.closest('.bitem'); if (!it || document.body.classList.contains('wiggle')) return;
        clearTimeout(pressT); pressT = setTimeout(() => document.body.classList.add('wiggle'), 500);
      });
      addEventListener('pointerup', () => clearTimeout(pressT));
      $('#bfull').addEventListener('click', e => {
        const rm = e.target.closest('[data-rm]'); if (!rm) return;
        bItems = bItems.filter(it => it.id !== rm.dataset.rm); renderItems();
        if (!bItems.length) document.body.classList.remove('wiggle');
      });

      /* ---------- 처음 쓰는 사람에게: 반투명 커서가 직접 빈칸을 그려 여는 시범. 직접 한 번 열면 다시 안 나옴 ---------- */
      const LEARN_KEY = 'blip.blankDeclare.learned';
      const learned = () => { try { return localStorage.getItem(LEARN_KEY) === '1' } catch (err) { return false } };
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const CUR = '<svg class="a" viewBox="0 0 24 24"><path d="M4 2l15 11.5-6.6.9 3.8 7.4-2.9 1.4-3.8-7.5L4 20.4z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>' +
        '<svg class="x" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M12 3v18M3 12h18" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>';
      const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      let gh = null, ghTimers = [], ghRaf = 0, ghIdle = 0;
      const later = (ms, f) => ghTimers.push(setTimeout(f, ms));
      function ghostStop() {
        ghTimers.forEach(clearTimeout); ghTimers = []; cancelAnimationFrame(ghRaf);
        if (gh) { const g = gh; gh = null; g.classList.remove('on'); setTimeout(() => g.remove(), 400) }
      }
      function ghostSchedule(ms) {
        clearTimeout(ghIdle); if (learned()) return;
        ghIdle = setTimeout(() => { if (!rgEl && !dr && !query && !learned()) ghostPlay() }, ms);
      }
      function ghostPlay() {
        ghostStop();
        const W = Math.min(340, innerWidth * .5), H = W * 290 / 500, x0 = innerWidth / 2 - W / 2, y0 = innerHeight / 2 - H / 2;
        gh = document.createElement('div'); gh.className = 'gh'; gh.setAttribute('aria-hidden', 'true');
        gh.innerHTML = '<div class="rg"></div><div class="cur">' + CUR + '</div><div class="cap">드래그해서 빈칸을 열어보세요</div>';
        document.body.appendChild(gh);
        const rg = gh.querySelector('.rg'), cur = gh.querySelector('.cur'), cap = gh.querySelector('.cap');
        Object.assign(cap.style, { left: innerWidth / 2 + 'px', top: y0 + H + 22 + 'px' });
        const place = (w, h) => Object.assign(rg.style, { left: x0 + 'px', top: y0 + 'px', width: w + 'px', height: h + 'px' });
        const open = () => {
          rg.style.setProperty('--k', Math.min(W / 500, H / 290)); rg.classList.add('done');
          rg.innerHTML = '<div class="ri">' + regionIcons() + '</div><div class="caret"></div>';
          rg.querySelectorAll('.ri button').forEach((b, i) => reduced ? b.classList.add('pop') : later(90 * i, () => b.classList.add('pop')));
        };
        requestAnimationFrame(() => { if (gh) gh.classList.add('on') });
        if (reduced) { place(W, H); open(); cur.style.display = 'none'; return }
        rg.style.display = 'none';
        Object.assign(cur.style, { left: x0 + 'px', top: y0 + 'px' });
        const D = 1100;
        let finished = false;
        const drawTo = p => { const w = W * p, h = H * p; place(w, h); cur.style.left = x0 + w + 'px'; cur.style.top = y0 + h + 'px' };
        const finish = () => {
          if (finished || !gh) return; finished = true; cancelAnimationFrame(ghRaf);
          drawTo(1); cur.classList.remove('down', 'drag'); open();
        };
        later(550, () => cur.classList.add('down'));
        later(750, () => {
          rg.style.display = ''; cur.classList.add('drag');
          const t0 = performance.now();
          const step = now => {
            if (!gh || finished) return;
            const t = Math.min(1, (now - t0) / D);
            if (t >= 1) { finish(); return }
            drawTo(ease(t)); ghRaf = requestAnimationFrame(step);
          };
          ghRaf = requestAnimationFrame(step);
        });
        later(750 + D + 60, finish); // 애니메이션 프레임이 멈춰도(백그라운드 탭 등) 그리기는 반드시 끝남
        later(4300, () => { if (gh) gh.classList.remove('on') });
        later(4800, () => { if (gh) { gh.remove(); gh = null } ghostSchedule(1800) });
      }

      addEventListener('pointerdown', e => {
        ghostStop(); clearTimeout(ghIdle);
        if (e.button !== 0 || !e.target.closest) return;
        if (document.body.classList.contains('wiggle') && !e.target.closest('.bitem')) {
          document.body.classList.remove('wiggle'); return;
        }
        if (rgEl && !e.target.closest('.rg') && e.target.closest(NODRAW)) closeRegion();
        if (e.target.closest(NODRAW)) return;
        const was = !!rgEl; if (was) closeRegion();
        dr = { x: e.clientX, y: e.clientY, on: false, el: null };
      });
      addEventListener('pointermove', e => {
        if (!dr) return;
        if (!dr.on) {
          if (Math.hypot(e.clientX - dr.x, e.clientY - dr.y) < 6) return; // 6px 전에는 클릭으로 봄
          dr.on = true; closeRegion();
          dr.el = document.createElement('div'); dr.el.className = 'rg';
          document.body.appendChild(dr.el); document.body.classList.add('drawing');
        }
        Object.assign(dr.el.style, { left: Math.min(dr.x, e.clientX) + 'px', top: Math.min(dr.y, e.clientY) + 'px', width: Math.abs(e.clientX - dr.x) + 'px', height: Math.abs(e.clientY - dr.y) + 'px' });
      });
      addEventListener('pointerup', () => {
        if (!dr) { ghostSchedule(5000); return }
        const d = dr; dr = null;
        if (!d.on) { ghostSchedule(5000); return }
        try { localStorage.setItem(LEARN_KEY, '1') } catch (err) { }
        document.body.classList.remove('drawing');
        openRegion(d.el);
      });
      addEventListener('keydown', e => { if (e.key === 'Escape') { closeRegion(); document.body.classList.remove('wiggle') } });
      document.addEventListener('keydown', e => {
        if (e.target.closest('input') || query) return;
        const arr = items();
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); select(Math.min(arr.length - 1, sel + 1)) }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); select(Math.max(0, sel - 1)) }
      });

      $('#dtT').addEventListener('input', () => { purpose = $('#dtT').value });
      $('#pubAll').addEventListener('click', () => {
        const b = $('#pubAll');
        b.textContent = '발행됨 ✓'; setTimeout(() => { b.textContent = '발행하기' }, 1200);
      });

      addEventListener('resize', renderFlow);
      renderAll(); loadBar();
      ghostSchedule(1200);
    })();
  </script>
</body>

</html>
